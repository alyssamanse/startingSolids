<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Starting Solids</title>

<!-- iOS "Add to Home Screen" behavior -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Starting Solids" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- Android / general PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7C9473" />
<link rel="icon" href="icon-192.png" />

<style>
  html, body { margin: 0; padding: 0; background: #FBF6EC; overscroll-behavior-y: contain; }
  #root { min-height: 100vh; }
  #boot-loading { display:flex; align-items:center; justify-content:center; height:100vh; font-family: -apple-system, system-ui, sans-serif; color:#7B7568; }
</style>
</head>
<body>
<div id="root"><div id="boot-loading">Loading…</div></div>
<script src="app.bundle.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
